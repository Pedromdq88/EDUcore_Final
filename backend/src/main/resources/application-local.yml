
spring:
  application:
    name: educore-sge-backend

  config:
    import: "file:./backend/.env[.properties]"

  datasource:
    url: jdbc:mysql://localhost:3306/educore_sge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${EDUCORE_DB_USER:root}
    password: ${EDUCORE_DB_PASSWORD:Root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    rabbit:
      enabled: false

educore:
  bootstrap:
    director-email: ${EDUCORE_DIRECTOR_EMAIL:}
    director-password: ${EDUCORE_DIRECTOR_PASSWORD:}
    tenant-id: ${EDUCORE_DIRECTOR_TENANT_ID:}
    school-name: ${EDUCORE_BOOTSTRAP_SCHOOL_NAME:}

  gmail:
    enabled: ${EDUCORE_GMAIL_ENABLED:false}
    from-address: ${EDUCORE_GMAIL_FROM:}
    client-id: ${EDUCORE_GMAIL_CLIENT_ID:}
    client-secret: ${EDUCORE_GMAIL_CLIENT_SECRET:}
    refresh-token: ${EDUCORE_GMAIL_REFRESH_TOKEN:}
