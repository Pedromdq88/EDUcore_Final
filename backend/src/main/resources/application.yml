spring:
  application:
    name: educore-sge-backend
  profiles:
    default: local

  datasource:
    url: jdbc:mysql://localhost:3306/educore_sge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  config:
    import: "optional:file:./.env[.properties]"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        enable_lazy_load_no_trans: true

flyway:
  enabled: true
  baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Alta inicial segura de un Director (no se guarda contraseña en el repositorio)
educore:
  bootstrap:
    director-email: ${EDUCORE_DIRECTOR_EMAIL:}
    director-password: ${EDUCORE_DIRECTOR_PASSWORD:}
    tenant-id: ${EDUCORE_DIRECTOR_TENANT_ID:}
    school-name: ${EDUCORE_BOOTSTRAP_SCHOOL_NAME:}

  # Gmail API: consent only to gmail.send from a dedicated school sender.
  gmail:
    enabled: ${EDUCORE_GMAIL_ENABLED:false}
    from-address: ${EDUCORE_GMAIL_FROM:}
    client-id: ${EDUCORE_GMAIL_CLIENT_ID:}
    client-secret: ${EDUCORE_GMAIL_CLIENT_SECRET:}
    refresh-token: ${EDUCORE_GMAIL_REFRESH_TOKEN:}
