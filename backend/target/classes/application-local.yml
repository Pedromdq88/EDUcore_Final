spring:
  application:
    name: educore-sge-backend

  datasource:
    url: jdbc:mysql://localhost:3306/educore_sge?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: lautaro
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  # Desactivamos el chequeo automático de RabbitMQ para limpiar la consola
  health:
    rabbit:
      enabled: false
educore:
  allowed-origins: http://localhost:4200,http://127.0.0.1:4200,http://localhost:5500,http://127.0.0.1:5500
  frontend-url: http://localhost:4200/login